[package]
name = "lakk-app"
version = "0.1.4"
edition = "2021"
description = "Lakk — apprends l'anglais depuis le français"

[lib]
name = "lakk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-notification = { version = "2", features = [] }

# Synthèse vocale neuronale Microsoft Edge (gratuite, sans clé API).
msedge-tts = "0.4"

# Fournisseur cryptographique explicite pour rustls.
# Plusieurs deps (reqwest/msedge-tts) tirent à la fois `aws-lc-rs` et `ring` :
# on force `ring` (plus léger à compiler) et on l'installe au démarrage.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Cœur métier Rust : contenu, SRS FSRS, gamification.
lakk-core = { path = "../crates/lakk-core" }

# Ce crate est son propre workspace pour rester indépendant du workspace
# principal (crates/lakk-core + crates/lakk-cli).
[workspace]
